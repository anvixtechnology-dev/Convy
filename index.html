<!doctype html>
<!-- taste-skill (design-taste-frontend 2.5.1). Page type software, site-kind software.
     data-buttons arrow and the dots mark were dealt; data-radius soft is the default for software. -->
<html lang="en" data-type="software" data-radius="soft" data-buttons="arrow" data-motion>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CONVY: a shared WhatsApp inbox for business teams</title>
    <meta
      name="description"
      content="Turn WhatsApp enquiries into coordinated customer work. Bring your inbox, team, templates, and campaigns together on the official WhatsApp Business API."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CONVY: a shared WhatsApp inbox for business teams" />
    <meta property="og:description" content="Your WhatsApp inbox, templates, campaigns, and team in one workspace." />
    <meta property="og:image" content="/share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0B0708" />
    <!-- <link rel="canonical" href="https://[the client's domain]/"> : add once the domain is confirmed -->
    <meta name="site-kind" content="software" />
    <meta name="page-type" content="software" />

    <!-- Layer order first: Tailwind's base sits under the kit, Tailwind's utilities over it. -->
    <style>@layer theme, base, kit, components, utilities;</style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/kit.css" />
    <link rel="stylesheet" href="/assets/motion/motion.css" />
    <!-- Burgundy and black: the page near-black, burgundy for actions, rose for accents on black; keep after the kit: layout.css resets --ly-scale -->
    <style>
      :root {
        --p-bg: #0B0708; --p-surface: #140C0E; --p-ink: #F7F1F2; --p-muted: #C9B8BD;
        --p-accent: #B3264A; --p-accent-ink: #FFFFFF; --p-action: #B3264A; --p-action-ink: #FFFFFF;
        --p-inv-bg: #2A0811; --p-inv-surface: #3A0E19; --p-inv-ink: #F7F1F2; --p-inv-muted: #DCC3CA;
        --p-inv-accent: #E8728E; --p-inv-accent-ink: #0B0708; --p-inv-action: #E8728E; --p-inv-action-ink: #0B0708;
        --font-display: "Instrument Sans", system-ui, sans-serif;
        --font-text: "Instrument Sans", system-ui, sans-serif;
        --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --display-weight: 500;
        --display-tracking: -0.028em;
        --display-tracking-xl: -0.036em;
        --display-stretch: 96%;
        --ly-scale: 1.04;
      }
    </style>
    <!-- the hero's entrance and the moments' guard, before the first paint -->
    <script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
    <script>document.documentElement.classList.add('mo-js');setTimeout(()=>document.documentElement.classList.add('mo-safe'),2500)</script>
    <script src="/assets/backgrounds/backgrounds.js"></script>
  </head>
  <body>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
